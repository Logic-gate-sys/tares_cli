# Reusable build workflow, producess output
name: Build Tares CLI

on:
    workflow_call:

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.3"

            - name: Install packages
              run: go mod download

            - name: Run all tests
              run: |
                  make unit-tests
                  make integration-tests
                  make ws-tests
