name: Build and Deploy Tares CLI

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: action/checkout@v4
            # setup go
            # NOTE: actions/setup-go@v5 automatically handles dependency caching
            # by monitoring your go.sum file out-of-the-box!
            - name: Setup go
              uses: actions/setup-go@v5
              with:
                  go-version: 1.26.0

            - name: Install dependencies
              run: go mod download
            # run all unit tests
            - name: Run all unit tests
              run: go test -v ./server/tests/unit/...
            # Build and upload go production binaries
            - name: Build CLI Binaries
              run: |
                  mkdir -p bin
                  Go build -o bin/server  ./server/main.go
                  Go build -o bin/client  ./client/main.go

            - name: Upload Built Binaries
              uses: actions/upload-artifact@v4
              with:
                  name: bin
                  path: bin/
