services:
  db:
    container_name: taresDB
    image: postgres:17-alpine 
    ports:
      - "5431:5432"
    volumes:
      - "./server/databases/postgres-data:/var/lib/postgresql/data:rw"
    environment:
      - POSTGRES_USER=logic
      - POSTGRES_DB=tares_db
      - POSTGRES_PASSWORD=logicgate
    restart: unless-stopped

